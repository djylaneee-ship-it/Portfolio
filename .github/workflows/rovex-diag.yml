# Diagnostic de la base en ligne des IDs : appelle chaque fonction avec des valeurs factices.
name: Rovex Hub — diagnostic base des IDs

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fonctions rovex_*
        run: |
          U="https://owupuxmgxtjmslhhawaf.supabase.co/rest/v1/rpc"
          K="sb_publishable__eVSL4bz7tZOZmjkOlMy8Q_rmyr55sN"
          call() { echo "== $1"; curl -s -w "  [HTTP %{http_code}]\n" -X POST "$U/$1" -H "apikey: $K" -H "Content-Type: application/json" -d "$2"; }
          call rovex_status '{}'
          call rovex_ping '{}'
          call rovex_check '{"p_code":"RDH-AAAA-BBBB-CCCC"}'
          call rovex_login '{"p_code":"RDH-AAAA-BBBB-CCCC"}'
          call rovex_codes '{"p_key":"RDH-AAAA-BBBB-CCCC"}'
          call rovex_get_shared '{"p_code":"RDH-AAAA-BBBB-CCCC"}'
          call rovex_create '{"p_key":"x","p_code":"RDH-AAAA-BBBB-CCCC","p_label":"","p_days":1,"p_admin":false}'
          call rovex_update '{"p_key":"x","p_id":"x","p_revoked":null,"p_add_days":null,"p_permanent":null}'
          call rovex_delete '{"p_key":"x","p_id":"x"}'
          call rovex_import '{"p_key":"x","p_codes":[]}'
          call rovex_put_shared '{"p_key":"x","p_name":"examples","p_data":{}}'
          call rovex_reset_master '{"p_key":"x","p_new":"x"}'
          call rovex_gen_status '{"p_code":"RDH-AAAA-BBBB-CCCC"}'
          echo "== fonction rovex-gen (GET)"
          curl -s -w "  [HTTP %{http_code}]\n" "https://owupuxmgxtjmslhhawaf.supabase.co/functions/v1/rovex-gen" -H "apikey: $K"
          echo "== fonction rovex-gen (POST avec un faux ID : doit refuser l'ID, sans rien générer)"
          curl -s -w "  [HTTP %{http_code}]\n" -X POST "https://owupuxmgxtjmslhhawaf.supabase.co/functions/v1/rovex-gen" -H "apikey: $K" -H "Content-Type: application/json" -d '{"type":"image","code":"RDH-AAAA-BBBB-CCCC","prompt":"test"}'
