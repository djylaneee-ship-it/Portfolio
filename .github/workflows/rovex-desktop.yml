# Construit l'application Windows Rovex Hub (Rovex-Hub-Setup-x.y.z.exe) et la publie dans les
# releases GitHub. Les apps déjà installées se mettent à jour toutes seules depuis ces releases.
# Pour sortir une nouvelle version : augmenter "version" dans roblox-dev-hub/package.json.
name: Rovex Hub — application Windows

on:
  push:
    paths:
      - 'roblox-dev-hub/package.json'
      - '.github/workflows/rovex-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rovex-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: roblox-dev-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Vérifie que la base en ligne des IDs répond (ne bloque pas la construction).
      - name: Base des IDs en ligne
        continue-on-error: true
        shell: bash
        run: |
          curl -s -X POST "https://owupuxmgxtjmslhhawaf.supabase.co/rest/v1/rpc/rovex_status" \
            -H "apikey: sb_publishable__eVSL4bz7tZOZmjkOlMy8Q_rmyr55sN" -H "Content-Type: application/json" -d '{}'

      - name: Dépendances
        run: npm install --no-audit --no-fund

      # GitHub ne publie une release que si son tag existe : on crée v<version> s'il manque.
      - name: Tag de version
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ -z "$(git ls-remote --tags origin "refs/tags/$V")" ]; then
            git tag "$V" && git push origin "$V"
          fi

      - name: Construire l'installeur
        run: npx electron-builder --win nsis --publish never

      # Une seule release par version, avec l'installeur, son .blockmap et latest.yml (lu par les mises à jour
      # automatiques). On supprime d'abord les releases en double de ce tag et celles qui n'ont qu'un .blockmap.
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          gh api "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$V\" or ((.assets | length) > 0 and ([.assets[].name] | all(endswith(\".blockmap\"))))) | .id" |
            while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id"; done
          gh release create "$V" dist/*.exe dist/*.blockmap dist/latest.yml --repo "$REPO" \
            --title "Rovex Hub ${V#v}" --notes "Rovex Hub ${V#v} pour Windows : télécharge Rovex-Hub-Setup-${V#v}.exe et double-clique dessus." --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rovex-Hub-Setup
          path: roblox-dev-hub/dist/*.exe
          retention-days: 14
