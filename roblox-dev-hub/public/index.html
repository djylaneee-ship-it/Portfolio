<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rovex Hub</title>
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="Rovex Hub">
        <span class="logo"><img src="logo.png" alt=""></span>
        <span class="brand-text"><b>ROVEX</b><small>HUB</small></span>
      </a>

      <nav class="nav" id="nav">
        <span class="nav-pill" id="nav-pill"></span>
        <a href="#/" data-route="home"><svg class="line" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home"></span></a>
        <a href="#/chat" data-route="chat"><svg class="line" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" style="stroke-width:2.6"/></svg><span data-i18n="nav.chat"></span><i class="nav-dot ok" id="chat-dot" hidden></i></a>
        <a href="#/library" data-route="library"><svg class="line" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM8 7h6M8 11h6"/></svg><span data-i18n="nav.library"></span></a>
        <a href="#/folders" data-route="folders"><svg class="line" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg><span data-i18n="nav.folders"></span></a>
        <a href="#/opensource" data-route="opensource"><svg class="line" viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13.5 5l-3 14"/></svg><span data-i18n="nav.opensource"></span></a>
        <a href="#/examples" data-route="examples"><svg class="line" viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg><span data-i18n="nav.examples"></span></a>
        <a href="#/textures" data-route="textures"><svg class="line" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 13v8M13 17h8"/></svg><span data-i18n="nav.textures"></span></a>
        <a href="#/skills" data-route="skills"><svg class="line" viewBox="0 0 24 24"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.4 7.2 16.9l.9-5.4L4.2 7.7l5.4-.8z"/><path d="M5 21h14"/></svg><span data-i18n="nav.skills"></span></a>
        <a href="#/prompts" data-route="prompts"><svg class="line" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span data-i18n="nav.prompts"></span></a>
        <a href="#/studio" data-route="studio"><svg class="line" viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg><span data-i18n="nav.studio"></span></a>
        <a href="#/level" data-route="level"><svg class="line" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav.level"></span></a>
        <a href="#/update" data-route="update"><svg class="line" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="nav.update"></span><i class="nav-dot" id="upd-dot" hidden></i></a>
        <a href="#/explore" data-route="explore" class="admin-only"><svg class="line" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span data-i18n="nav.explore"></span></a>
        <a href="#/connect" data-route="connect"><svg class="line" viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/></svg><span data-i18n="nav.connect"></span></a>
        <a href="#/robloxstudio" data-route="robloxstudio"><svg class="line" viewBox="0 0 24 24"><path d="M6.5 3.5l14 3.8-3.8 14-14-3.8z"/><path d="M10.6 9.4l3.9 1.1-1.1 3.9-3.9-1.1z"/></svg><span data-i18n="nav.rstudio"></span><i class="nav-dot ok" id="rs-dot" hidden></i></a>
        <a href="#/blender" data-route="blender"><svg class="line" viewBox="0 0 24 24"><circle cx="14" cy="13" r="5"/><circle cx="14" cy="13" r="1.6"/><path d="M3 9h7M6 5l6 5"/></svg><span>Blender</span></a>
        <a href="#/channels" data-route="channels"><svg class="line" viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg><span data-i18n="nav.channels"></span></a>
        <a href="#/youtube" data-route="youtube"><svg class="line" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span data-i18n="nav.youtube"></span></a>
        <a href="#/favorites" data-route="favorites" class="admin-only"><svg class="line" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg><span data-i18n="nav.favorites"></span></a>
        <a href="#/dev" data-route="dev" class="admin-only dev-only"><svg class="line" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg><span data-i18n="nav.dev"></span></a>
        <a href="#/admin" data-route="admin" class="admin-only"><svg class="line" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.5-8 9.5-4.6-1-8-5-8-9.5V6z"/><path d="M9.5 12l2 2 3.5-4"/></svg><span data-i18n="nav.admin"></span></a>
      </nav>

      <div id="side-places" hidden>
        <div class="side-title">Roblox Studio</div>
        <div class="cats" id="side-places-list"></div>
      </div>

      <div>
        <div class="side-title" data-i18n="side.categories"></div>
        <div class="cats" id="side-cats"></div>
      </div>

      <div id="side-job" class="side-job admin-only" hidden></div>
      <div id="side-user" class="side-user"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" data-i18n-title="menu"><svg class="line" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="space-switch" id="space-switch" role="tablist">
          <span class="sw-pill" id="sw-pill"></span>
          <button data-space="create" role="tab"><span>🎨</span><b data-i18n="space.create"></b></button>
          <button data-space="resources" role="tab"><span>📚</span><b data-i18n="space.resources"></b></button>
        </div>
        <label class="search">
          <svg class="line" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" data-i18n-ph="search.ph" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </label>
        <a class="icon-btn" href="#/custom" id="custom-btn" data-i18n-title="nav.custom"><svg class="line" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1.1.2-2.2 1.4-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></a>
        <a class="status-pill off" id="mcp-pill" href="#/connect"><span class="pulse"></span><span class="lbl" id="mcp-pill-text"></span></a>
        <button class="btn primary admin-only" id="add-btn"><svg class="line" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="add"></span></button>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="icon-btn modal-x" data-close aria-label="Close" data-i18n-title="close"><svg class="line" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <span class="logo big"><img src="logo.png" alt=""></span>
      <h1>ROVEX <b>HUB</b></h1>
      <p data-i18n="login.text"></p>
      <input id="login-code" class="input" placeholder="RDH-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" required>
      <button class="btn primary" data-i18n="login.go"></button>
      <div class="login-err" id="login-err"></div>
      <small data-i18n="login.help"></small>
      <select class="select" id="login-lang" aria-label="Language"></select>
    </form>
  </div>

  <div class="dropzone" id="dropzone" hidden><div><span data-i18n="drop.title"></span><small data-i18n="drop.sub"></small></div></div>
  <div class="toasts" id="toasts"></div>
  <script src="custom.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
