<!doctype html>
<html><head><meta charset="utf-8"><title>Rovex Hub</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', Inter, sans-serif; user-select: none; }
  .card { position: absolute; inset: 10px; border-radius: 26px; background: radial-gradient(120% 90% at 50% 0%, #2A1458 0%, #0B0814 60%); border: 1px solid #2B2140; display: grid; place-items: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: in .5s cubic-bezier(.2,1.4,.4,1) both; }
  .wrap { display: grid; justify-items: center; gap: 18px; }
  .logo { position: relative; width: 104px; height: 104px; border-radius: 28px; background: linear-gradient(145deg, #8B5CF6, #6D28D9); display: grid; place-items: center; box-shadow: 0 0 0 0 rgba(139,92,246,.6); animation: pulse 1.8s ease-out infinite; }
  .logo img { width: 70%; animation: spin 6s linear infinite; }
  h1 { margin: 0; color: #fff; font-size: 26px; letter-spacing: 3px; font-weight: 800; }
  h1 b { color: #A78BFA; font-weight: 800; }
  .bar { width: 170px; height: 4px; border-radius: 4px; background: #241A3A; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7C3AED, #C4B5FD); animation: load 1.1s ease-in-out infinite; }
  small { color: #8F86A8; font-size: 12px; }
  @keyframes in { from { opacity: 0; transform: scale(.9); } }
  @keyframes pulse { 70% { box-shadow: 0 0 0 22px rgba(139,92,246,0); } 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
</style></head>
<body><div class="card"><div class="wrap">
  <div class="logo"><img src="logo.png" alt=""></div>
  <h1>ROVEX <b>HUB</b></h1>
  <div class="bar"><i></i></div>
  <small id="msg">Starting…</small>
</div></div>
<script>
  const l = (() => { try { return localStorage.getItem('rdh-lang'); } catch { return ''; } })() || navigator.language.slice(0, 2);
  document.getElementById('msg').textContent = { fr: 'Démarrage…', es: 'Iniciando…', pt: 'Iniciando…' }[l] || 'Starting…';
</script>
</body></html>
